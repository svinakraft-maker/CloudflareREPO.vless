# profile-title: CLASH ClashFone.yaml
# profile-update-interval: 1
# Date/Time: 2026-08-25 / 15:47 (Moscow)
# Количество: 109
mixed-port: 7890
allow-lan: false
mode: rule
log-level: silent
unified-delay: true
geodata-mode: true
tcp-concurrent: true
sniffer:
  enable: true
  sniff:
    HTTP: {ports: [80, 8080-8880], override-destination: true}
    TLS: {ports: [443, 8443]}
  skip-domain:
    - '+.lan'
    - '+.local'
profile:
  store-selected: true
dns:
  enable: true
  ipv6: false
  prefer-h3: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.stun.*.*'
    - 'lens.l.google.com'
    - 'stun.l.google.com'
    - 'localhost.ptlogin2.qq.com'
    - 'www.msftconnecttest.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
  fallback:
    - 'https://dns.google/dns-query'
    - 'https://cloudflare-dns.com/dns-query'
proxies:
# (WARP proxies removed - using our proxies)
proxy-groups:
  - name: "🚀 Выбрать вручную"
    type: select
    include-all-proxies: true
    filter: "vless|vmess|trojan|ss|hysteria2"
  
  - name: "⚡️ Авто"
    type: url-test
    tolerance: 150
    interval: 300
    url: "http://www.google.com/generate_204"
    include-all-proxies: true
    filter: "vless|vmess|trojan|ss|hysteria2"
    hidden: true
  
  - name: "📺 YouTube"
    type: select
    proxies:
      - "⚡️ Авто"
      - "🚀 Выбрать вручную"
  
  - name: "💬 Telegram"
    type: select
    proxies:
      - "⚡️ Авто"
      - "🚀 Выбрать вручную"
  
  - name: "🌍 Геоблок"
    type: select
    proxies:
      - "⚡️ Авто"
      - "🚀 Выбрать вручную"
  
  - name: "🔓 Без VPN"
    type: select
    proxies:
      - DIRECT
    hidden: true
  
  - name: "⛔ Блок"
    type: select
    proxies:
      - REJECT
    hidden: true
rules:
  - DOMAIN-SUFFIX,googlevideo.com,📺 YouTube
  - DOMAIN-SUFFIX,youtube.com,📺 YouTube
  - DOMAIN-SUFFIX,ytimg.com,📺 YouTube
  - DOMAIN-SUFFIX,t.me,💬 Telegram
  - DOMAIN-SUFFIX,telegram.org,💬 Telegram
  - IP-CIDR,91.108.4.0/22,💬 Telegram,no-resolve
  - IP-CIDR,91.108.8.0/22,💬 Telegram,no-resolve
  - IP-CIDR,91.108.12.0/22,💬 Telegram,no-resolve
  - IP-CIDR,91.108.16.0/22,💬 Telegram,no-resolve
  - IP-CIDR,91.108.20.0/22,💬 Telegram,no-resolve
  - IP-CIDR,91.108.56.0/22,💬 Telegram,no-resolve
  - IP-CIDR,95.161.64.0/20,💬 Telegram,no-resolve
  - IP-CIDR,149.154.160.0/20,💬 Telegram,no-resolve
  - DOMAIN-SUFFIX,instagram.com,🌍 Геоблок
  - DOMAIN-SUFFIX,facebook.com,🌍 Геоблок
  - DOMAIN-SUFFIX,fbcdn.net,🌍 Геоблок
  - DOMAIN-SUFFIX,twitter.com,🌍 Геоблок
  - DOMAIN-SUFFIX,x.com,🌍 Геоблок
  - DOMAIN-SUFFIX,twimg.com,🌍 Геоблок
  - GEOIP,CN,DIRECT
  - MATCH,🚀 Выбрать вручную
