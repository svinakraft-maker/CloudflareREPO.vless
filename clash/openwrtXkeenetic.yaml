# profile-title: CLASH openwrtXkeenetic.yaml
# profile-update-interval: 1
# Date/Time: 2026-08-26 / 14:53 (Moscow)
# Количество: 156
profile-title: CLASH openwrtXkeenetic.yaml
profile-update-interval: 1
Date/Time: 2026-08-26 / 14:30 (Moscow)
mixed-port: 7890
allow-lan: false
mode: rule
log-level: silent
unified-delay: true
geodata-mode: true
tcp-concurrent: true
sniffer:
  enable: true
  sniff:
    HTTP: {ports: [80, 8080-8880], override-destination: true}
    TLS: {ports: [443, 8443]}
  skip-domain:
    - '+.lan'
    - '+.local'
profile:
  store-selected: true
dns:
  enable: true
  ipv6: false
  prefer-h3: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '.lan'
    - '.local'
    - '+.stun.*'
    - 'lens.l.google.com'
    - 'stun.l.google.com'
    - 'localhost.ptlogin2.qq.com'
    - 'dns.msftncsi.com'
    - 'www.msftncsi.com'
    - 'www.msftconnecttest.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
  fallback:
    - 'https://dns.google/dns-query'
    - 'https://cloudflare-dns.com/dns-query'
proxy-providers:
  sub:
    type: http
    url: "https://raw.githack.com/svinakraft-maker/FlareFeed/main/public/fastest.txt"
    path: ./proxy_providers/sub.yml
    override:
      udp: true
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204
proxy-groups:
  - name: "PROXY"
    type: select
    url: http://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 300
    icon: https://i.imgur.com/B3HrpPC.png
    proxies:
      - auto
      - DIRECT
    use:
      - sub

  - name: "auto"
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 300
    tolerance: 150
    lazy: true
    use:
      - sub

  - name: "🎮 Discord"
    type: select
    proxies:
      - auto
      - PROXY
      - DIRECT

  - name: "☁️ Cloudflare WARP"
    type: select
    proxies:
      - auto
      - PROXY
      - DIRECT

  - name: "🔍 IP Check"
    type: select
    proxies:
      - DIRECT
      - auto
      - PROXY

  - name: "🌍 GLOBAL"
    type: select
    proxies:
      - PROXY
      - auto
      - DIRECT

  - name: "📺 YouTube"
    type: select
    proxies:
      - auto
      - PROXY
      - DIRECT

  - name: "💬 Telegram"
    type: select
    proxies:
      - auto
      - PROXY
      - DIRECT

  - name: "📷 Instagram"
    type: select
    proxies:
      - auto
      - PROXY
      - DIRECT

  - name: "🤖 OpenAI"
    type: select
    proxies:
      - auto
      - PROXY
      - DIRECT

  - name: "🔓 Без VPN"
    type: select
    proxies:
      - DIRECT
    hidden: true

  - name: "⛔ Блок"
    type: select
    proxies:
      - REJECT
    hidden: true
