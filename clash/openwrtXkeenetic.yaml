proxy-groups:
  - name: "PROXY"
    type: select
    url: http://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 300
    icon: https://i.imgur.com/B3HrpPC.png
    proxies:
      - auto
      - DIRECT
    use:
      - sub
  - name: "auto"
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 300
    tolerance: 150
    lazy: true
    use:
      - sub
  - name: Обход качества Twitch
    type: select
    include-all-proxies: true
    proxies:
      - auto
      - PROXY
      - DIRECT
    icon: https://raw.githubusercontent.com/codelabhq/icons/main/twitch-icon.svg
  - name: Игры
    type: select
    include-all-proxies: true
    proxies:
      - auto
      - PROXY
      - DIRECT
    icon: https://raw.githubusercontent.com/codelabhq/icons/main/steampowered-icon.svg
  - name: YouTube
    type: select
    include-all-proxies: true
    proxies:
      - auto
      - PROXY
      - DIRECT
    icon: https://raw.githubusercontent.com/codelabhq/icons/main/youtube-icon.svg
  - name: Discord
    type: select
    include-all-proxies: true
    proxies:
      - auto
      - PROXY
      - DIRECT
    icon: https://raw.githubusercontent.com/codelabhq/icons/main/discord-icon.svg
  - name: Telegram
    type: select
    include-all-proxies: true
    proxies:
      - auto
      - PROXY
      - DIRECT
    icon: https://raw.githubusercontent.com/codelabhq/icons/main/telegram-icon.svg
  - name: Meta
    type: select
    include-all-proxies: true
    proxies:
      - auto
      - PROXY
      - DIRECT
    icon: https://raw.githubusercontent.com/codelabhq/icons/main/meta-icon.svg
  - name: Геоблок
    type: select
    include-all-proxies: true
    proxies:
      - auto
      - PROXY
      - DIRECT
    icon: https://raw.githubusercontent.com/codelabhq/icons/main/geoblock-icon.svg
  - name: AI
    type: select
    include-all-proxies: true
    proxies:
      - auto
      - PROXY
      - DIRECT
    icon: https://raw.githubusercontent.com/codelabhq/icons/main/openai-icon.svg
  - name: Torrent
    type: select
    include-all-proxies: true
    proxies:
      - DIRECT
    icon: https://raw.githubusercontent.com/codelabhq/icons/main/torrent-icon.svg
  - name: Все остальное
    type: select
    include-all-proxies: true
    proxies:
      - auto
      - PROXY
      - DIRECT
    icon: https://raw.githubusercontent.com/codelabhq/icons/main/global-icon.svg
  - name:  Блок
    type: select
    hidden: true
    proxies:
      - REJECT
  - name: ⏭️ Пропуск
    type: select
    hidden: true
    proxies:
      - PASS

rules:
  - RULE-SET,private-ips,DIRECT,no-resolve
  - RULE-SET,private-domains,DIRECT
  # === РУССКИЕ САЙТЫ И ПРИЛОЖЕНИЯ ===
  - RULE-SET,category-ru,DIRECT
  - RULE-SET,whitelist,DIRECT
  - RULE-SET,direct-ips,DIRECT,no-resolve
  # === TELEGRAM ===
  - RULE-SET,telegram,Telegram
  # === БЛОКИРОВКА БЕСПОЛЕЗНОЙ РЕКЛАМЫ TWITCH ===
  - DOMAIN-SUFFIX,adserver.twitch.tv,REJECT
  - DOMAIN-SUFFIX,ads.twitch.tv,REJECT
  - DOMAIN-KEYWORD,twitch-ads,REJECT
  - DOMAIN-KEYWORD,amazon-adsystem,REJECT
  # === ОБХОД ОГРАНИЧЕНИЯ КАЧЕСТВА TWITCH ===
  - DOMAIN-SUFFIX,usher.ttvnw.net,Обход качества Twitch
  - DOMAIN-SUFFIX,gql.twitch.tv,Обход качества Twitch
  # === ОСТАЛЬНЫЙ ТРАФИК TWITCH — НАПРЯМУЮ ===
  - DOMAIN-SUFFIX,twitch.tv,DIRECT
  - DOMAIN-SUFFIX,ttvnw.net,DIRECT
  - DOMAIN-SUFFIX,jtvnw.net,DIRECT
  # === ОСТАЛЬНЫЕ СЕРВИСЫ ===
  - RULE-SET,youtube,YouTube
  - RULE-SET,discord,Discord
  - RULE-SET,ai,AI
  - RULE-SET,meta,Meta,no-resolve
  - RULE-SET,twitter,Геоблок
  - RULE-SET,tiktok,Геоблок
  - RULE-SET,netflix,Геоблок
  - RULE-SET,porno,Геоблок
  - RULE-SET,torrent,Torrent
  - RULE-SET,tools,Геоблок
  - RULE-SET,socials,Геоблок
  - RULE-SET,music,Геоблок
  - RULE-SET,games,Геоблок
  - RULE-SET,Ubisoft,Игры
  - RULE-SET,EA,Игры
  - RULE-SET,Blizzard,Игры
  - RULE-SET,Epic,Игры
  - DOMAIN-KEYWORD,notion,Геоблок
  - DOMAIN-SUFFIX,ntc.party,PROXY
  # === СЛУЖЕБНЫЙ ТРАФИК GOOGLE И CHROME ===
  - DOMAIN-SUFFIX,googleapis.com,DIRECT
  - DOMAIN-SUFFIX,gstatic.com,DIRECT
  - DOMAIN-SUFFIX,google.com,DIRECT
  - DOMAIN-KEYWORD,chrome,DIRECT
  # === Activision и матчмейкинг ===
  - DOMAIN-SUFFIX,activision.com,Игры
  - DOMAIN-SUFFIX,callofduty.com,Игры
  - DOMAIN-SUFFIX,demonware.net,Игры
  - DOMAIN-SUFFIX,mw3.demonware.net,Игры
  # === Apple ===
  - DOMAIN-SUFFIX,apple.com,PROXY
  # === ОБХОД БЛОКИРОВОК РКН ===
  - RULE-SET,HODCA,PROXY
  - MATCH,DIRECT
