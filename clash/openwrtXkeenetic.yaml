mixed-port: 7890
tproxy-port: 7891
allow-lan: true
mode: rule
log-level: silent
unified-delay: true
geodata-mode: true
tcp-concurrent: true
geodata-loader: memconservative
auto-redir:
  enable: true
  auto-route: true
  stack: system
sniffer:
  enable: true
  sniff:
    HTTP: {ports: [80, 8080-8880], override-destination: true}
    TLS: {ports: [443, 8443]}
  skip-domain:
    - '+.lan'
    - '+.local'
    - '+.push.apple.com'
profile:
  store-selected: true
dns:
  enable: true
  ipv6: false
  prefer-h3: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.stun.*.*'
    - 'lens.l.google.com'
    - 'stun.l.google.com'
    - 'localhost.ptlogin2.qq.com'
    - 'www.msftconnecttest.com'
    - '+.apple.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
  fallback:
    - 'https://dns.google/dns-query'
    - 'https://cloudflare-dns.com/dns-query'
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
