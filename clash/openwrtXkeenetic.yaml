  - name: "🚀 Выбрать вручную"
    type: select
    include-all-proxies: true
    filter: "vless|vmess|trojan|ss|hysteria2"
  
  - name: "⚡️ Авто"
    type: url-test
    tolerance: 150
    interval: 300
    url: "http://www.google.com/generate_204"
    include-all-proxies: true
    filter: "vless|vmess|trojan|ss|hysteria2"
  
  - name: "🌍 Геоблок"
    type: select
    proxies:
      - "⚡️ Авто"
      - "🚀 Выбрать вручную"
  
  - name: "🌐 По умолчанию"
    type: select
    proxies:
      - "⚡️ Авто"
      - "🚀 Выбрать вручную"
  - name: "🔓 Без VPN"
    type: select
    proxies:
      - DIRECT
    hidden: true
  
  - name: "⛔ Блок"
    type: select
    proxies:
      - REJECT
    hidden: true
